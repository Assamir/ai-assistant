<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assystent</title>
    <style>
      body {
        margin: 0;
        background: #0f0c14;
      }
      body.avatar-overlay {
        background: transparent;
      }
      @media (max-width: 880px) {
        .assystent-grid {
          grid-template-columns: 1fr !important;
        }
      }
    </style>
    <script>
      /* Avatar window: transparent body before React hydrates to prevent flash */
      if (window.location.hash !== '#config') {
        document.body.classList.add('avatar-overlay');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
