# Konfiguracja dev — zakładamy start backendu z katalogu głównego repozytorium (`uvicorn …` jak w scripts/start-dev.bat).
# Piper CLI: `powershell -ExecutionPolicy Bypass -File scripts/install-piper-windows.ps1`.
# Wakeword „Hej Aria”: openWakeWord ma głównie modele EN; prefiks po polsku jest obcinany z transkryptu STT (`audio.strip_wake_phrase_from_transcription`).

general:
  assistant_name: Aria
  content_root: "."

audio:
  strip_wake_phrase_from_transcription: true
  wake_transcription_prefixes:
    - "hej aria"
    - "hej, aria"
    - "cześć aria"

ocr:
  # Domyślnie wyłączone. Włączenie: najpierw w venv `pip install -r requirements-vision.txt`,
  # potem tutaj `enabled: true` i restart backendu. Alternatywa: vlm.enabled (Moondream, patrz ENV_SETUP).
  enabled: true
  use_gpu: false

mcp:
  enabled: true

tts:
  piper_executable: "tools/piper/piper/piper.exe"
  piper_voice_onnx_path: "frontend/resources/piper-voices/pl/pl_PL/gosia/medium/pl_PL-gosia-medium.onnx"

# Opcjonalnie — LM Studio / niektóre modele (np. Gemma) ignorują role=tool; włącz echo wyniku jako user:
# ai_runtime:
#   mirror_tool_results_as_user: true
